spring:
  application.name: nohorny
  # Disable the default HTML error page.
  web.error.whitelabel.enabled: false
  # The Mindustry server list refresh resolves host names, a second thread keeps the retention on time meanwhile.
  task.scheduling.pool.size: 2
  jpa:
    # The schema is managed by the Flyway migrations in db/migration.
    hibernate.ddl-auto: none
    open-in-view: false

server:
  # Listen on localhost. Use 0.0.0.0 to expose the API on your network.
  address: 127.0.0.1
  # HTTP port used for the app
  port: 8080
  # Set to framework when running behind a trusted reverse proxy that overwrites the Forwarded/X-Forwarded-* headers.
  # The client address is used for the rate limits and to recognize the Mindustry servers.
  forward-headers-strategy: none
  servlet.session.cookie:
    # The admin page and the API share the same origin, the session cookie is never needed cross-site.
    same-site: lax

nohorny:
  # Public address of the server, such as https://nohorny.example.com.
  # When set, the classification responses link to the request pages.
  # public-url: https://nohorny.example.com
  storage:
    # SQLite database file.
    database: database.sqlite
    # Directory of the stored images, one file per distinct image named by its SHA-256 hash.
    images: images
  security:
    # Administrator account created on startup, the other users are managed from the admin page.
    # Its password and role are restored on every startup, which makes the configuration the recovery path.
    # No account is created while the password is blank. Keep the trailing colon of the placeholder,
    # it resolves to blank when the variable is missing.
    admin:
      username: admin
      # password: ${NOHORNY_ADMIN_PASSWORD:}
  requests:
    # How long the images rated WARN or NSFW, or that failed classification, are kept. Safe images are never stored.
    image-retention: 14d
    # How long the requests are kept. The all-time statistics are not affected.
    retention: 90d
  # Requests per minute. Limited clients get a 429 with a Retry-After header.
  rate-limit:
    # Classifications per address without an account. 0 requires one.
    anonymous: 5
    # Classifications per listed Mindustry network without an account, shared by its servers. 0 requires one.
    mindustry: 60
    # Classifications of a new account, shared by its addresses. Each account has its own, set from the admin panel.
    user: 120
    # Reads and purges of the request pages per address. Administrators are not limited.
    reads: 60
    purges: 5
  mindustry:
    # How often the public Mindustry server list is refreshed to recognize the request origins.
    refresh-interval: 10m
  classifier:
    # Use vit, sight-engine, or a list such as [vit, sight-engine].
    # A chain advances only while the latest result is NSFW.
    # Perfect when you want to filter out safe images with a cheap classifier
    # before using the premium one on the rest.
    type: vit
    vit:
      source:
        type: hugging-face
        hugging-face:
          # Hugging Face repository that contains the ONNX model file.
          repository: onnx-community/nsfw_image_detection-ONNX
          # Repository revision to download from. Pinning a commit keeps deployments reproducible.
          revision: 1ceb3c7fe1e9f3f2507e6df577437f23a9149fd5
          # ONNX model file loaded from the repository and revision above.
          # Use onnx/model_fp16.onnx to halve the memory usage at a small speed cost.
          file: onnx/model.onnx
          # Local directory for downloaded model files.
          download-directory: .cached-models
          # Only needed for private or gated Hugging Face models.
          # token: ${HF_TOKEN}
        local:
          # ONNX model file, see download-and-convert-model.sh to convert a Hugging Face ViT model.
          path: my_model.onnx
      # Labels returned by the model, in the same order as its output probabilities.
      labels:
        - normal
        - nsfw
      # Which label from the list above is treated as the NSFW score.
      nsfw-label: nsfw
      # Number of loaded models, each handles a single image at a time.
      # Every instance keeps its own copy of the model in memory.
      instances: 1
      thresholds:
        # Scores below warn are SAFE. Scores from warn up to nsfw are WARN.
        warn: 0.6
        # Scores at or above nsfw are NSFW. Keep this greater than or equal to warn.
        nsfw: 0.9
    # Enable SightEngine by including sight-engine in nohorny.classifier.type.
    sight-engine:
      # SightEngine API user.
      user: ${SIGHT_ENGINE_USER}
      # SightEngine API secret.
      secret: ${SIGHT_ENGINE_SECRET}
      thresholds:
        # Scores below warn are SAFE. Scores from warn up to nsfw are WARN.
        warn: 0.4
        # Scores at or above nsfw are NSFW. Keep this greater than or equal to warn.
        nsfw: 0.55
  status:
    motd: ok
