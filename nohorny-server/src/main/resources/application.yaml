spring:
  application.name: nohorny
  # Disable the default HTML error page.
  web.error.whitelabel.enabled: false

server:
  # Listen on localhost. Use 0.0.0.0 to expose the API on your network.
  address: 127.0.0.1
  # HTTP port used for the app
  port: 8080
  # Uncomment to serve the API under a prefix such as /api.
  # That would change the endpoints to /api/status and /api/classify.
  # servlet.context-path: /api

nohorny:
  classifier:
    # Use vit, sight-engine, or a list such as [vit, sight-engine].
    # A chain advances only while the latest result is NSFW.
    # Perfect when you want to filter out safe images with a cheap classifier
    # before using the premium one on the rest.
    type: vit
    vit:
      source:
        type: hugging-face
        hugging-face:
          # Hugging Face repository that contains the ONNX model file.
          repository: onnx-community/nsfw_image_detection-ONNX
          # Repository revision to download from. Pinning a commit keeps deployments reproducible.
          revision: 1ceb3c7fe1e9f3f2507e6df577437f23a9149fd5
          # ONNX model file loaded from the repository and revision above.
          # Use onnx/model_fp16.onnx to halve the memory usage at a small speed cost.
          file: onnx/model.onnx
          # Local directory for downloaded model files.
          download-directory: .cached-models
          # Only needed for private or gated Hugging Face models.
          # token: ${HF_TOKEN}
        local:
          # ONNX model file, see download-and-convert-model.sh to convert a Hugging Face ViT model.
          path: my_model.onnx
      # Labels returned by the model, in the same order as its output probabilities.
      labels:
        - normal
        - nsfw
      # Which label from the list above is treated as the NSFW score.
      nsfw-label: nsfw
      # Number of loaded models, each handles a single image at a time.
      # Every instance keeps its own copy of the model in memory.
      instances: 1
      thresholds:
        # Scores below warn are SAFE. Scores from warn up to nsfw are WARN.
        warn: 0.6
        # Scores at or above nsfw are NSFW. Keep this greater than or equal to warn.
        nsfw: 0.9
    # Enable SightEngine by including sight-engine in nohorny.classifier.type.
    sight-engine:
      # SightEngine API user.
      user: ${SIGHT_ENGINE_USER}
      # SightEngine API secret.
      secret: ${SIGHT_ENGINE_SECRET}
      thresholds:
        # Scores below warn are SAFE. Scores from warn up to nsfw are WARN.
        warn: 0.4
        # Scores at or above nsfw are NSFW. Keep this greater than or equal to warn.
        nsfw: 0.55
  status:
    motd: ok
