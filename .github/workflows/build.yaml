name: "Build"

on:
  # Lets the draft-release workflow build in release mode
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.plugin.outputs.version }}
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
  release:
    types: [ released, prereleased ]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_is_release: ${{ github.event_name == 'release' || inputs.release }}

jobs:

  plugin:
    name: "Plugin"
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # A release must be tagged with the project version, anything else must not reuse an existing tag
      - name: "Get And Validate Version"
        id: version
        run: |
          version="$(java .github/scripts/Version.java get)"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' does not match the project version 'v$version'"
              exit 1
            fi
          elif [ -n "$(git tag -l "v$version")" ]; then
            echo "::error::'v$version' already exists as a git tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Build Plugin"
        run: ./gradlew :nohorny-common:build :nohorny-plugin:build
        env:
          NOHORNY_TEST_PROXYSCRAPE: "${{ github.event_name != 'release' && 'true' || '' }}"
          NOHORNY_TEST_DISCORD_WEBHOOK: "${{ github.event_name != 'release' && secrets.NOHORNY_TEST_DISCORD_WEBHOOK || '' }}"

      - name: "Upload Plugin Jar"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nohorny-plugin
          path: "nohorny-plugin/build/libs/nohorny-plugin.jar"
          archive: false
          if-no-files-found: error

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-plugin
          path: |
            nohorny-common/build/test-results/test/TEST-*.xml
            nohorny-common/build/reports/
            nohorny-plugin/build/test-results/test/TEST-*.xml
            nohorny-plugin/build/reports/

      # Only the common and client modules are published to Maven
      - name: "Publish to Maven"
        if: ${{ github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) }}
        run: ./gradlew :nohorny-common:publish :nohorny-plugin:publish
        env:
          ORG_GRADLE_PROJECT_xpdustryUsername: "${{ secrets.XPDUSTRY_MAVEN_USERNAME }}"
          ORG_GRADLE_PROJECT_xpdustryPassword: "${{ secrets.XPDUSTRY_MAVEN_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_PASSWORD }}"

  natives:
    name: "Natives (${{ matrix.platform }})"
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The manylinux images keep the glibc requirement low (2.28)
          - platform: linux-x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - platform: windows-x86_64
            runner: blacksmith-4vcpu-windows-2025
          - platform: macos-aarch64
            runner: blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ${{ matrix.container }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The checkout is owned by the runner user but the container steps run as root,
      # so git refuses to read the repository until the directory is marked as safe
      - name: "Trust Repository"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Cache Natives"
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: nohorny-native/build/generated/native
          key: natives-${{ matrix.platform }}-${{ hashFiles('nohorny-native/CMakeLists.txt', 'nohorny-native/cmake/**', 'nohorny-native/src/**') }}

      - name: "Setup Java 25"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: "Build Natives"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: ./gradlew :nohorny-native:cmakeBuild

      - name: "Upload Natives"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natives-${{ matrix.platform }}
          path: nohorny-native/build/generated/native/
          if-no-files-found: error

  server:
    name: "Server"
    needs: natives
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Gradle builds the pages with pnpm. The action reads the pnpm version from nohorny-frontend/package.json
      - name: "Setup pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: "nohorny-frontend/package.json"

      - name: "Setup Node.js 24"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "nohorny-frontend/pnpm-lock.yaml"

      # The natives of every platform are bundled in the server jar
      - name: "Download Natives"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: natives-*
          path: prebuilt-natives
          merge-multiple: true

      - name: "Build Server"
        run: ./gradlew :nohorny-frontend:check :nohorny-server:build -Pprebuilt_natives=prebuilt-natives

      - name: "Upload Server Jar"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nohorny-server
          path: "nohorny-server/build/libs/nohorny-server.jar"
          archive: false
          if-no-files-found: error

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-server
          path: |
            nohorny-server/build/test-results/test/TEST-*.xml
            nohorny-server/build/reports/

  docker:
    name: "Docker"
    needs: server
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: "ghcr.io"
      IMAGE_NAME: "${{ github.repository }}-server"
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image only needs the linux-x86_64 natives
      - name: "Download Natives"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: natives-linux-x86_64
          path: prebuilt-natives

      - name: "Setup Docker Builder"
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: xpdustry/nohorny-server

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract Docker Metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: "Build and Publish Docker Image"
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: "."
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            IS_RELEASE=${{ github.event_name == 'release' }}
            PREBUILT_NATIVES=prebuilt-natives

  release:
    name: "Release"
    needs: [ plugin, server ]
    if: ${{ github.event_name == 'release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      # The release is pinned to a commit, so the bump goes to the first branch containing it
      - name: "Bump Version"
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          branch="$DEFAULT_BRANCH"
          for candidate in master dev; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$candidate"; then
              branch="$candidate"
              break
            fi
          done
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # The branch may have moved since the draft was created, so bump its build file rather than the tagged one
          git checkout "origin/$branch" -- build.gradle.kts
          if [ "v$(java .github/scripts/Version.java get)" != "$TAG" ]; then
            echo "::notice::The version of $branch already moved past $TAG, nothing to bump"
          else
            echo "version=$(java .github/scripts/Version.java bump)" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit Release Changes"
        if: ${{ steps.bump.outputs.version != '' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore(release): Bump version to ${{ steps.bump.outputs.version }}"
          repo: ${{ github.repository }}
          branch: ${{ steps.bump.outputs.branch }}
          file_pattern: "build.gradle.kts"

  event-file:
    name: "Event File"
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:

      - name: "Upload Event File"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
