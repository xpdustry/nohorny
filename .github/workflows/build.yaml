name: "Build"

on:
  # Lets the draft-release workflow build in release mode
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.plugin.outputs.version }}
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    paths-ignore: [ "**/*.md" ]
  release:
    types: [ released, prereleased ]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_is_release: ${{ github.event_name == 'release' || inputs.release }}

jobs:

  plugin:
    name: "Plugin"
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # A release must be tagged with the project version, a draft must not reuse an existing tag.
      # Other builds only warn, commits predating the version bump of a release still have to build
      - name: "Get And Validate Version"
        id: version
        env:
          IS_DRAFT: ${{ inputs.release }}
        run: |
          version="$(java .github/scripts/Version.java get)"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' does not match the project version 'v$version'"
              exit 1
            fi
          elif [ -n "$(git tag -l "v$version")" ]; then
            if [ "$IS_DRAFT" = "true" ]; then
              echo "::error::'v$version' already exists as a git tag"
              exit 1
            fi
            echo "::warning::'v$version' already exists as a git tag, the version needs a bump before the next release"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Build Plugin"
        run: ./gradlew :nohorny-common:build :nohorny-plugin:build
        env:
          NOHORNY_TEST_PROXYSCRAPE: "${{ github.event_name != 'release' && 'true' || '' }}"
          NOHORNY_TEST_DISCORD_WEBHOOK: "${{ github.event_name != 'release' && secrets.NOHORNY_TEST_DISCORD_WEBHOOK || '' }}"

      - name: "Upload Plugin Jar"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nohorny-plugin
          path: "nohorny-plugin/build/libs/nohorny-plugin.jar"
          archive: false
          if-no-files-found: error

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-plugin
          path: |
            nohorny-common/build/test-results/test/TEST-*.xml
            nohorny-common/build/reports/
            nohorny-plugin/build/test-results/test/TEST-*.xml
            nohorny-plugin/build/reports/

      # Only the common and client modules are published to Maven, forks lack the credentials of the xpdustry repository
      - name: "Publish to Maven"
        if: ${{ github.repository_owner == 'xpdustry' && (github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'))) }}
        run: ./gradlew :nohorny-common:publish :nohorny-plugin:publish
        env:
          ORG_GRADLE_PROJECT_xpdustryUsername: "${{ secrets.XPDUSTRY_MAVEN_USERNAME }}"
          ORG_GRADLE_PROJECT_xpdustryPassword: "${{ secrets.XPDUSTRY_MAVEN_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_PASSWORD }}"

  server:
    name: "Server"
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Gradle builds the pages with pnpm. The action reads the pnpm version from nohorny-frontend/package.json
      - name: "Setup pnpm"
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: "nohorny-frontend/package.json"

      - name: "Setup Node.js 24"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "nohorny-frontend/pnpm-lock.yaml"

      - name: "Build Server"
        run: ./gradlew :nohorny-frontend:check :nohorny-server:build

      - name: "Upload Server Jar"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nohorny-server
          path: "nohorny-server/build/libs/nohorny-server.jar"
          archive: false
          if-no-files-found: error

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-server
          path: |
            nohorny-server/build/test-results/test/TEST-*.xml
            nohorny-server/build/reports/

  docker:
    name: "Docker"
    needs: server
    if: ${{ (github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: "ghcr.io"
      IMAGE_NAME: "${{ github.repository }}-server"
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Setup Docker Builder"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract Docker Metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: "Build and Publish Docker Image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: "."
          push: true
          cache-from: type=gha,scope=nohorny-server
          cache-to: type=gha,scope=nohorny-server,mode=max
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            IS_RELEASE=${{ github.event_name == 'release' }}

  post-release:
    name: "Post Release"
    needs: [ plugin, server ]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      # The release is pinned to a commit, so the bump goes to the first branch containing it
      - name: "Bump Version"
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          branch="$DEFAULT_BRANCH"
          for candidate in master dev; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$candidate"; then
              branch="$candidate"
              break
            fi
          done
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # The branch may have moved since the draft was created, so bump its files rather than the tagged ones
          git checkout "origin/$branch" -- gradle/libs.versions.toml README.md
          if [ "v$(java .github/scripts/Version.java get)" != "$TAG" ]; then
            echo "::notice::The version of $branch already moved past $TAG, nothing to bump"
          else
            echo "version=$(java .github/scripts/Version.java bump)" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit Release Changes"
        if: ${{ steps.bump.outputs.version != '' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore(release): Bump version to ${{ steps.bump.outputs.version }}"
          repo: ${{ github.repository }}
          branch: ${{ steps.bump.outputs.branch }}
          file_pattern: "gradle/libs.versions.toml README.md"

  event-file:
    name: "Event File"
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:

      - name: "Upload Event File"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
