name: "Draft Release"

on:
  workflow_dispatch:

# The called build workflow derives its group from the caller name, this one must differ or it cancels this run
concurrency:
  group: "draft-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    uses: ./.github/workflows/build.yaml
    with:
      release: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # Releases are immutable, so the jars are attached to a draft that is then published from GitHub
  draft:
    name: "Draft"
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Download Jars"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nohorny-*
          path: artifacts
          merge-multiple: true

      # The draft is pinned to this commit so the published tag matches the attached jars,
      # its notes start as the commit list since the previous tag, to be rewritten before publishing
      - name: "Create Draft Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.build.outputs.version }}"
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git log --format='- %s (%h)' "${previous:+$previous..}HEAD" > notes.md
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            artifacts/nohorny-client.jar \
            artifacts/nohorny-server.jar
