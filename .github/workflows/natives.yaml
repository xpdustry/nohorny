name: "Natives"

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true

jobs:

  build:
    name: "${{ matrix.platform }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The manylinux images keep the glibc requirement low (2.28)
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # A clean build takes about 10 minutes on every platform, mostly compiling OpenCV
    timeout-minutes: 20
    container: ${{ matrix.container }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The checkout is owned by the runner user but the container steps run as root,
      # so git refuses to read the repository until the directory is marked as safe
      - name: "Trust Repository"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Setup Java 25"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: "Build Natives"
        run: ./gradlew :nohorny-native:cmakeBuild

      - name: "Upload Natives"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: natives-${{ matrix.platform }}
          path: nohorny-native/build/generated/native/
          if-no-files-found: error

  save:
    name: "Save"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:

      - name: "Download Natives"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: natives-*
          path: prebuilt-natives
          merge-multiple: true

      - name: "Save Natives"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: prebuilt-natives
          key: ${{ inputs.key }}
