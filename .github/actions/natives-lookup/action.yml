name: "Natives Lookup"
description: "Restores the prebuilt natives of the current sources"

outputs:
  key:
    value: ${{ steps.key.outputs.key }}
  cached:
    value: ${{ steps.restore.outputs.cache-hit == 'true' }}

runs:
  using: "composite"
  steps:

    - name: "Compute Natives Key"
      id: key
      shell: bash
      env:
        HASH: ${{ hashFiles('nohorny-native/CMakeLists.txt', 'nohorny-native/cmake/**', 'nohorny-native/src/**') }}
      run: echo "key=prebuilt-natives-$HASH" >> "$GITHUB_OUTPUT"

    - name: "Restore Natives"
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: prebuilt-natives
        key: ${{ steps.key.outputs.key }}
